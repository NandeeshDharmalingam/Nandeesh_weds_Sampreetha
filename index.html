<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FBF6EA">
  <title>Nandeesh &amp; Sampreetha | Wedding Invitation</title>
  <meta name="description" content="With the blessings of Lord Sri Venkateshwara, Nandeesh and Sampreetha invite you to celebrate their wedding on 19 February 2027.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nandeesh &amp; Sampreetha | Wedding Invitation">
  <meta property="og:description" content="With the blessings of Lord Sri Venkateshwara, Nandeesh and Sampreetha invite you to celebrate their wedding on 19 February 2027.">
  <link rel="icon" href="public/images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="public/fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="public/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.className += ' js';</script>
  <script src="config.js" charset="utf-8" defer></script>
  <script src="js/flowers.js" defer></script>
  <script src="js/music.js" defer></script>
  <script src="js/calendar.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="is-locked">

<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.8" cy="18" r="2.4" fill="currentColor"/><circle cx="16.8" cy="16" r="2.4" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.8l5.2 4v-13l-5.2 4H4z" fill="currentColor"/><path d="M16 9.2a4.2 4.2 0 010 5.6M18.4 6.8a7.6 7.6 0 010 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.8l5.2 4v-13l-5.2 4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 7h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="2.6" fill="#FFFDF7" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="17" r="2.6" fill="#FFFDF7" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 10-13 0C5.5 15.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="currentColor"/></symbol>
</svg>

<noscript>
  <p class="noscript">Please turn on JavaScript to view this wedding invitation. Nandeesh &amp; Sampreetha, 19 February 2027.</p>
</noscript>

<!-- ======================= WELCOME / ENTRANCE ======================= -->
<div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" aria-describedby="welcome-blessing">
  <div class="welcome__glow" aria-hidden="true"></div>
  <img class="welcome__kolam" data-deco="kolam" data-img="kolam" src="public/images/decor/kolam.svg" alt="" width="240" height="240" aria-hidden="true">
  <div class="welcome__frame" aria-hidden="true"></div>

  <div class="banana banana--tl" data-deco="banana" aria-hidden="true"><img data-img="bananaLeaf" src="public/images/decor/banana-leaf.svg" alt="" width="330" height="320"></div>
  <div class="banana banana--tr" data-deco="banana" aria-hidden="true"><img data-img="bananaLeaf" src="public/images/decor/banana-leaf.svg" alt="" width="330" height="320"></div>
  <div class="banana banana--bl" data-deco="banana" aria-hidden="true"><img data-img="bananaLeaf" src="public/images/decor/banana-leaf.svg" alt="" width="330" height="320"></div>
  <div class="banana banana--br" data-deco="banana" aria-hidden="true"><img data-img="bananaLeaf" src="public/images/decor/banana-leaf.svg" alt="" width="330" height="320"></div>
  <img class="blossom blossom--l" data-deco="banana" data-img="bananaBlossom" src="public/images/decor/banana-blossom.svg" alt="" width="60" height="130" aria-hidden="true">
  <img class="blossom blossom--r" data-deco="banana" data-img="bananaBlossom" src="public/images/decor/banana-blossom.svg" alt="" width="60" height="130" aria-hidden="true">

  <div class="welcome__scroll">
    <div class="welcome__content">
      <div class="welcome__emblem">
        <button type="button" class="bell bell--l" data-deco="bells" data-bell tabindex="-1" aria-hidden="true"><img data-img="templeBell" src="public/images/decor/temple-bell.svg" alt="" width="80" height="150"></button>
        <img class="welcome__ganesha" data-img="ganesha" src="public/images/ganesha.svg" alt="Lord Ganesha" width="84" height="84" fetchpriority="high">
        <button type="button" class="bell bell--r" data-deco="bells" data-bell data-bell-label="text.welcome.bellLabel"><img data-img="templeBell" src="public/images/decor/temple-bell.svg" alt="" width="80" height="150"></button>
      </div>
      <p class="welcome__shloka" lang="kn" data-text="text.welcome.ganeshaLine"></p>
      <div class="welcome__gopuram"><img data-img="gopuram" src="public/images/gopuram.svg" alt="Temple gopuram" width="400" height="520" fetchpriority="high"></div>
      <div id="welcome-title" class="welcome__names"><span class="n" data-text="couple.groom"></span><span class="amp" aria-hidden="true">&amp;</span><span class="sr-only"> and </span><span class="n" data-text="couple.bride"></span></div>
      <img class="welcome__divider" data-img="ornamentDivider" src="public/images/decor/ornament-divider.svg" alt="" width="320" height="40" aria-hidden="true">
      <p class="welcome__mantra" lang="kn" data-text="text.welcome.mantra"></p>
      <p id="welcome-blessing" class="welcome__blessing" data-text="text.welcome.blessing"></p>
      <div class="welcome__actions">
        <button type="button" id="enter" class="btn btn--gold" data-text="text.welcome.enterButton"></button>
        <button type="button" id="enter-music" class="btn btn--ghost" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-note"/></svg><span data-text="text.welcome.enterWithMusicButton"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============================ INVITATION ============================ -->
<main id="main" tabindex="-1" aria-hidden="true" inert>

  <!-- Opening -->
  <header id="opening" class="section hero" data-section="opening">
    <div class="hero__frame" aria-hidden="true"></div>
    <div class="toran toran--top" data-deco="toran" aria-hidden="true"></div>
    <img class="hero__kolam" data-deco="kolam" data-img="kolam" src="public/images/decor/kolam.svg" alt="" width="240" height="240" loading="lazy" aria-hidden="true">
    <div class="section__inner hero__inner">
      <img class="hero__ganesha" data-img="ganesha" src="public/images/ganesha.svg" alt="Lord Ganesha" width="84" height="84" data-reveal>
      <p class="hero__shloka" lang="kn" data-text="text.welcome.ganeshaLine" data-reveal></p>
      <p class="eyebrow" data-text="text.hero.eyebrow" data-reveal></p>
      <h1 class="hero__names" data-reveal><span class="n" data-text="couple.groom"></span><span class="amp" aria-hidden="true">&amp;</span><span class="sr-only"> and </span><span class="n" data-text="couple.bride"></span></h1>
      <p class="hero__invite" data-text="text.hero.invite" data-reveal></p>
      <div class="hero__gopuram" data-reveal><img data-img="gopuram" src="public/images/gopuram.svg" alt="Temple gopuram" width="400" height="520"></div>
      <p class="hero__date" id="hero-date" data-reveal></p>
      <p class="hero__blessing" data-reveal><img data-img="namam" src="public/images/namam.svg" alt="" width="52" height="40" aria-hidden="true"><span data-text="text.welcome.blessing"></span></p>
    </div>
    <a class="scroll-cue" href="#family"><span class="sr-only" data-text="text.hero.scrollHint"></span><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"/></svg></a>
  </header>

  <!-- Family introduction -->
  <section id="family" class="section family" data-section="family" aria-labelledby="family-title">
    <div class="garland garland--top" data-deco="garlands" aria-hidden="true"></div>
    <div class="section__inner">
      <img class="divider" data-img="ornamentDivider" src="public/images/decor/ornament-divider.svg" alt="" width="320" height="40" loading="lazy" aria-hidden="true" data-reveal>
      <h2 id="family-title" class="h2" data-text="text.family.heading" data-reveal></h2>
      <p id="family-message" class="lead" data-reveal></p>
      <div id="family-parents" class="family__parents" data-reveal></div>
      <img class="divider divider--gopuram" data-img="dividerGopuram" src="public/images/decor/divider-gopuram.svg" alt="" width="360" height="64" loading="lazy" aria-hidden="true" data-reveal>
    </div>
    <div class="garland garland--bottom" data-deco="garlands" aria-hidden="true"></div>
  </section>

  <!-- Events are created from config.js -->
  <div id="events"></div>

  <!-- Final blessing -->
  <section id="blessing" class="section blessing" data-section="blessing" aria-labelledby="blessing-title">
    <div class="toran toran--top" data-deco="toran" aria-hidden="true"></div>
    <div class="section__inner">
      <img class="blessing__namam" data-img="namam" src="public/images/namam.svg" alt="" width="104" height="80" loading="lazy" aria-hidden="true" data-reveal>
      <p class="blessing__mantra" lang="kn" data-text="text.blessing.mantra" data-reveal></p>
      <h2 id="blessing-title" class="h2" data-text="text.blessing.heading" data-reveal></h2>
      <p class="lead" data-text="text.blessing.message" data-reveal></p>
      <p class="blessing__signoff" data-text="text.blessing.signoff" data-reveal></p>
      <p class="blessing__names" data-reveal><span class="n" data-text="couple.groom"></span><span class="amp" aria-hidden="true">&amp;</span><span class="sr-only"> and </span><span class="n" data-text="couple.bride"></span></p>
    </div>
    <div class="blessing__scene" aria-hidden="true">
      <img class="blessing__temple" data-img="templeIllustration" src="public/images/temple.svg" alt="" width="600" height="310" loading="lazy">
      <img class="float-lotus float-lotus--l" data-deco="kolam" data-img="lotus" src="public/images/decor/lotus.svg" alt="" width="160" height="100" loading="lazy">
      <img class="float-lotus float-lotus--r" data-deco="kolam" data-img="lotus" src="public/images/decor/lotus.svg" alt="" width="160" height="100" loading="lazy">
    </div>
  </section>
</main>

<!-- ============================ MUSIC CONTROL ============================ -->
<div id="music" class="music" hidden>
  <div class="music__bar">
    <button type="button" id="music-toggle" class="music__main" aria-pressed="false">
      <span class="music__icon"><svg class="icon" aria-hidden="true"><use id="music-icon" href="#i-play"/></svg></span>
      <span id="music-label" class="music__label"></span>
      <span class="music__notes" aria-hidden="true">
        <svg class="note"><use href="#i-note"/></svg><svg class="note"><use href="#i-note"/></svg><svg class="note"><use href="#i-note"/></svg>
      </span>
    </button>
    <button type="button" id="music-more" class="music__more" aria-expanded="false" aria-controls="music-panel" aria-label="Music options">
      <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>
    </button>
  </div>
  <div id="music-panel" class="music__panel" role="group" aria-label="Wedding music" hidden>
    <p class="music__title"><strong id="music-track-title"></strong><span id="music-track-artist"></span></p>
    <p id="music-state" class="music__state" role="status"></p>
    <div class="music__row">
      <button type="button" id="music-mute" class="icon-btn" aria-pressed="false"><svg class="icon" aria-hidden="true"><use id="music-mute-icon" href="#i-volume"/></svg></button>
      <input id="music-volume" type="range" min="0" max="100" step="1" value="45">
    </div>
    <p id="music-device-volume" class="music__hint" hidden></p>
    <div id="music-track-row" class="music__row music__row--track" hidden>
      <label id="music-track-label" for="music-track"></label>
      <select id="music-track"></select>
    </div>
    <label id="bell-row" class="switch" hidden><input type="checkbox" id="bell-toggle"><span class="switch__box" aria-hidden="true"></span><span id="bell-label"></span></label>
    <button type="button" id="music-off" class="btn btn--ghost btn--small"></button>
  </div>
</div>

</body>
</html>
