<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="0 0 120 300" width="120" height="300" role="img" aria-label="Brass kuthu vilakku lamp">
  <style>
    .f{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.7s ease-in-out infinite}
    .d1{animation-delay:-.35s}.d2{animation-delay:-.8s}.d3{animation-delay:-1.2s}.d4{animation-delay:-.55s}
    .g{animation:gl 2.4s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.92,1.09) rotate(-2.5deg)}62%{transform:scale(1.06,.94) rotate(2.5deg)}}
    @keyframes gl{0%,100%{opacity:.85}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.f,.g{animation:none}}
    svg:target .f,svg:target .g{animation:none}
  </style>
  <defs>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E500F"/>
      <stop offset=".3" stop-color="#E9C25E"/>
      <stop offset=".55" stop-color="#F8E39B"/>
      <stop offset=".8" stop-color="#C08A25"/>
      <stop offset="1" stop-color="#7A4D0E"/>
    </linearGradient>
    <radialGradient id="fl" cx="50%" cy="78%" r="62%">
      <stop offset="0" stop-color="#FFFBD6"/>
      <stop offset=".45" stop-color="#FFC445"/>
      <stop offset="1" stop-color="#F0701A"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFD66B" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <g id="cup">
