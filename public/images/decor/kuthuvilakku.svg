      <path d="M-7.5 0C-6.5 7 6.5 7 7.5 0Z" fill="url(#br)" stroke="#7E500F" stroke-width=".6"/>
    </g>
  </defs>

  <ellipse class="g" cx="60" cy="118" rx="58" ry="52" fill="url(#glow)"/>

